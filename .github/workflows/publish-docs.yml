name: Publish Documentation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: ['Build and Publish Module']
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and Publish Module workflow run id that produced the docs artifact
        required: true
        type: string
      tag_name:
        description: Release tag associated with the documentation, for example v1.23.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish-docs:
    name: Publish docs to homotechsualdocs
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    steps:
      - name: Checkout HaloAPI repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve workflow context
        id: context
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $runId = '${{ inputs.run_id }}'
            $tagName = '${{ inputs.tag_name }}'
          } else {
            $runId = '${{ github.event.workflow_run.id }}'
            $tagName = '${{ github.event.workflow_run.head_branch }}'
          }

          if ([string]::IsNullOrWhiteSpace($runId)) {
            Write-Error 'Workflow run id was not provided by the event payload.'
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($tagName) -or -not $tagName.StartsWith('v')) {
            Write-Error "Expected a tag-based workflow run, received '$tagName'."
            exit 1
          }

          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      - name: Download documentation artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download ${{ steps.context.outputs.run_id }} --name module-docs --dir docs-artifact

      - name: Clone and update homotechsualdocs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $sourceRoot = Get-ChildItem -Path 'docs-artifact' -Directory -Recurse |
            Where-Object { $_.Name -ieq 'haloapi' } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $sourceRoot) {
            Write-Error 'Documentation artifact does not contain a haloapi docs root.'
            exit 1
          }

          $sourceCommandletsPath = Join-Path -Path $sourceRoot -ChildPath 'commandlets'
          $sourceIndexPath = Join-Path -Path $sourceRoot -ChildPath 'index.md'
          $sourceImagePath = Join-Path -Path $sourceRoot -ChildPath 'img'

          if (-not (Test-Path -Path $sourceCommandletsPath -PathType Container)) {
            Write-Error "Commandlets docs path not found: $sourceCommandletsPath"
            exit 1
          }

          if (-not (Test-Path -Path $sourceIndexPath -PathType Leaf)) {
            Write-Error "Docs index path not found: $sourceIndexPath"
            exit 1
          }

          git -c core.autocrlf=false clone https://x-access-token:$env:GH_TOKEN@github.com/homotechsual/homotechsualdocs.git docs-repo

          Push-Location docs-repo
          try {
            git config core.autocrlf false
            git remote set-url origin https://x-access-token:$env:GH_TOKEN@github.com/homotechsual/homotechsualdocs.git

            $targetBranch = 'main'
            git fetch origin $targetBranch
            git checkout -B $targetBranch "origin/$targetBranch"

            $pushCheckSucceeded = $true
            try {
              git push --dry-run origin "HEAD:$targetBranch"
            } catch {
              $pushCheckSucceeded = $false
            }

            if (-not $pushCheckSucceeded) {
              Write-Error "DOCS_REPO_TOKEN cannot push to homotechsual/homotechsualdocs:$targetBranch. Ensure the token has repository write access (contents:write)."
              exit 1
            }

            if (Test-Path 'docs/haloapi/commandlets') {
              Remove-Item -Path 'docs/haloapi/commandlets' -Recurse -Force
            }
            if (Test-Path 'docs/haloapi/img') {
              Remove-Item -Path 'docs/haloapi/img' -Recurse -Force
            }

            New-Item -Path 'docs/haloapi/commandlets' -ItemType Directory -Force | Out-Null
            Copy-Item -Path (Join-Path -Path $sourceCommandletsPath -ChildPath '*') -Destination 'docs/haloapi/commandlets' -Recurse -Force
            Copy-Item -Path $sourceIndexPath -Destination 'docs/haloapi/index.md' -Force

            if (Test-Path -Path $sourceImagePath -PathType Container) {
              Copy-Item -Path $sourceImagePath -Destination 'docs/haloapi/img' -Recurse -Force
            }

            git config user.email 'action@github.com'
            git config user.name 'GitHub Action'

            $changes = git status --porcelain
            if (-not $changes) {
              Write-Host 'No documentation changes to commit.' -ForegroundColor Yellow
              exit 0
            }

            git add docs/haloapi/commandlets docs/haloapi/index.md docs/haloapi/img
            git commit -m "Docs update for HaloAPI ${{ steps.context.outputs.tag_name }}"
            git push origin "HEAD:$targetBranch"
          } finally {
            Pop-Location
          }